# ============================================================
# sneaky-reader 配置文件
# 直接修改本文件并重启程序即可生效，无需任何可视化界面。
# ============================================================

# --- 小说来源 -------------------------------------------------
# 支持三种写法：
#   1) 单个文件：  source: library/天人图谱(1-500章).txt
#   2) 多个文件：  source:
#                    - library/天人图谱(1-500章).txt
#                    - library/天人图谱(501-1000章).txt
#   3) 一个目录：  source: library      （目录下所有 .txt 按文件名自然顺序合并）
# 路径支持绝对路径，或相对于本项目根目录的相对路径。
source: library/天人图谱(1-500章).txt

# --- 主题 -----------------------------------------------------
# 可选（均为低干扰的阅读配色，按需自行增删）：
#   dark      暗色（默认）
#   light     亮色
#   gray      灰底白字
#   sepia     米黄纸感
#   green     护眼豆沙绿
#   slate     石墨灰蓝
#   oled      纯黑高对比
# 各主题的具体色值见 src/themes.js。
theme: gray

# --- 字体 -----------------------------------------------------
# 字体族，逗号分隔，按前后顺序回退（中文优先）
fontFamily: "Sarasa Mono SC, SimSun, Times New Roman, serif"

# 正文字号（px）
fontSize: 12

# 行高倍数（相对字号），同时决定「逐行滚动」的步长
lineHeight: 1.7

# --- 窗口（初始默认设置）--------------------------------------
# 这里是你手写的初始设置：首次启动、或删除了下面的「记忆配置」后生效。
window:
  width: 400               # 窗口宽度（px）
  height: 100              # 窗口高度（px）
  position: top-left       # 首次启动位置：top-left / top-right / bottom-left / bottom-right / center
                           # 底部位置以「工作区」为基准，已自动避开 Windows 任务栏

  # 窗口不透明度：0.3 ~ 1，默认 1（完全不透明）。小于 1 时窗口半透明。
  opacity: 0.8

  # 半透明高斯模糊：置为 true 时启用系统级模糊（Windows 11 亚克力材质），
  # 让桌面背景在窗口后方呈现毛玻璃效果。仅在 opacity < 1 时可见。
  # 注：Electron 的透明窗口不支持缩放，因此这里用系统材质实现，而非 CSS 透明背景。
  blur: true

# --- 记忆配置（程序自动写入，请勿手动修改）--------------------
# 程序会在关闭、拖动或缩放结束后记录窗口的位置与尺寸，
# 下次启动优先按它恢复。删除本块中任意一行，该项即回到上面的「初始默认设置」。
remember:
  window:
    x: 76        # 上次关闭时的窗口横坐标
    y: 184       # 上次关闭时的窗口纵坐标
    width: 556   # 上次关闭时的窗口宽度（px）
    height: 224  # 上次关闭时的窗口高度（px）

# --- 阅读进度（程序自动写入，请勿手动修改）--------------------
progress:
  chapter: 2
  paragraph: 14
