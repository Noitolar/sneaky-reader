# ============================================================
# sneaky-reader 配置文件
# 直接修改本文件保存后即时生效（无需重启），也可用 Ctrl + , 打开配置菜单。
# ============================================================

# --- 小说来源（必填）------------------------------------------
# 把下面的 source 改成你自己的小说路径，支持三种写法：
#   1) 单个文件：  source: D:/小说/我的小说.txt
#   2) 多个文件：  source:
#                    - D:/小说/第一部.txt
#                    - D:/小说/第二部.txt
#   3) 一个目录：  source: D:/小说      （目录下所有 .txt 按文件名自然顺序合并）
# 相对路径以「本配置文件所在目录」为基准，也就是 exe 旁边。
# 路径填错或没填时，程序会直接在阅读窗口里给出提示。
source: library/天人图谱(1-500章).txt

# --- 主题 -----------------------------------------------------
# 可选（均为低干扰的阅读配色）：
#   dark      暗色（默认）
#   light     亮色
#   gray      灰底白字
#   sepia     米黄纸感
#   green     护眼豆沙绿
#   slate     石墨灰蓝
#   oled      纯黑高对比
theme: gray

# --- 字体 -----------------------------------------------------
# 字体族，逗号分隔，按前后顺序回退（中文优先）
fontFamily: Sarasa Mono SC

# 正文字号（px）
fontSize: 10

# 行高倍数（相对字号），同时决定「逐行滚动」的步长
lineHeight: 1.4

# --- 正则替换（只改显示内容，不改动小说文件）------------------
# 用途：把正文里不想看到的内容（网站广告、字数标记、分隔符等）替换掉或删掉。
# 只影响「显示出来的文字」，txt 文件本身不会被修改，章节识别与阅读进度也不受影响。
# 规则按顺序逐条应用到「章节标题 + 正文段落」；某段被替换后只剩空白时，该段整段隐藏。
# 每条的字段：
#   pattern  必填，正则表达式（建议用单引号包裹，反斜杠不会被转义）
#   replace  选填，替换成的文本；省略表示直接删掉匹配到的内容
#   flags    选填，正则标志，可组合；省略即为 g（替换全部匹配）。
#            注意：显式填写后不会再自动补 g，想「忽略大小写且全部替换」要写 gi。
#            实际有用：g 全部替换（默认）/ i 忽略大小写 / u 按 Unicode 码点；
#            m、s、y 因规则只作用于「单行」文本（章节标题或一个段落），基本无效。
# 替换文本中可用 $1 $2 引用捕获组，$& 代表整个匹配，$$ 表示字面量 $。
# 最多 200 条；写错正则的那一条会被忽略并在控制台提示，不影响其它规则。
replace:
  - pattern: 陈传
    replace: AAAA
    flags: g
# 常用示例（去掉行首的 #，并把上面的 replace: [] 换成 replace: 即可启用）：
# replace:
#   - pattern: '^[s　]*(请收藏本站|手机用户请浏览|天才一秒记住).*$'   # 整行的网站广告
#     replace: ''
#   - pattern: 'chapter\s*\d+'                                       # 英文「Chapter 12」标记（gi 忽略大小写）
#     flags: gi
#     replace: ''
#   - pattern: '[（(]本章完[）)]'                                     # 段尾或整行的「（本章完）」
#     replace: ''
#   - pattern: '^[s　]*本章完[s　]*$'                                # 整行只有「本章完」（无括号）
#     replace: ''
#   - pattern: '[s　]*[（(]d{1,4}[）)][s　]*$'                      # 段尾的（字数标记）
#     replace: ''
#   - pattern: '&nbsp;'                                              # 转义符
#     replace: ''

# --- 窗口（初始默认设置）--------------------------------------
# 这里是你手写的初始设置：首次启动、或删除了下面的「记忆配置」后生效。
window:
  width: 400               # 窗口宽度（px）
  height: 160              # 窗口高度（px）
  position: top-left       # 首次启动位置：top-left / top-right / bottom-left / bottom-right / center
                           # 底部位置以「工作区」为基准，已自动避开 Windows 任务栏

  # 窗口不透明度：0.3 ~ 1，默认 1（完全不透明）。小于 1 时窗口半透明，
  # 可看到桌面背景。
  opacity: 0.95

# --- 设置窗口（初始默认设置）----------------------------------
# 设置窗口是独立窗口（Ctrl + , 打开），同样可拖动与缩放，位置与尺寸独立记忆。
settingsWindow:
  width: 420               # 设置窗口宽度（px）
  height: 560              # 设置窗口高度（px）
  position: center         # 首次启动位置：top-left / top-right / bottom-left / bottom-right / center

# --- 记忆配置（程序自动写入，请勿手动修改）--------------------
# 程序会在关闭、拖动或缩放结束后记录窗口的位置与尺寸，
# 下次启动优先按它恢复。删除本块中任意一行，该项即回到上面的「初始默认设置」。
remember:
  # 窗口
  window:
    x: 8         # 上次关闭时的窗口横坐标
    y: 8         # 上次关闭时的窗口纵坐标
    width: 468   # 上次关闭时的窗口宽度（px）
    height: 180  # 上次关闭时的窗口高度（px）
  # 设置窗口
  settingsWindow:
    x: 560       # 上次关闭时的设置窗口横坐标
    y: 128       # 上次关闭时的设置窗口纵坐标
    width: 612   # 上次关闭时的设置窗口宽度（px）
    height: 560  # 上次关闭时的设置窗口高度（px）

# --- 阅读进度（程序自动写入，请勿手动修改）--------------------
progress:
  chapter: 10
  paragraph: 0
